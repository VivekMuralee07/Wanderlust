# Builds a signed release APK and publishes it as a GitHub Release when a version tag is pushed.
# The app's in-app updater picks up the newest release automatically.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64     base64 of your release keystore (.jks)
#   KEYSTORE_PASSWORD   keystore password
#   KEY_ALIAS           key alias inside the keystore
#   KEY_PASSWORD        key password
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (code $CODE)"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing — see README 'Publishing updates'."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Build signed APK
        env:
          WANDERLUST_KEYSTORE: release.jks
          WANDERLUST_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WANDERLUST_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WANDERLUST_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify "$APK" 2>/dev/null || ls "$ANDROID_HOME"/build-tools
          cp "$APK" "Wanderlust-${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Wanderlust-${{ steps.version.outputs.name }}.apk" \
            --title "Wanderlust ${{ steps.version.outputs.name }}" \
            --generate-notes

      - name: Clean up key
        if: always()
        run: rm -f release.jks
